<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Storm</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #c9d1e0; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #fps { position: fixed; top: 8px; left: 10px; opacity: .45; font-variant-numeric: tabular-nums; pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<div id="err"></div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
// One triangle that covers the whole screen. No vertex buffer needed:
// gl_VertexID 0,1,2 -> (0,0), (2,0), (0,2) in 0..2 space -> clip space -1..3.
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
out vec4 outColor;

// Coordinate system used everywhere below:
//   p.y goes 0 (bottom) .. 1 (top), p.x goes 0 .. aspect (width/height).
// Using the height as the unit keeps shapes round on any screen size.

uniform vec2  uRes;     // canvas size in pixels
uniform float uTime;    // seconds since start
uniform float uRain;    // rain amount 0..1
uniform float uCloud;   // cloud density 0..1

// Lightning (all set from JavaScript when a strike happens)
uniform float uFlash;      // overall sky/cloud brightness from the strike, 0..~1.5
uniform float uBolt;       // how visible the bolt channel is right now, 0..1
uniform vec2  uFlashPos;   // where the bolt starts inside the clouds
uniform vec4  uSeg[64];    // bolt segments: xy = start, zw = end
uniform float uSegB[64];   // brightness of each segment (branches are dimmer)
uniform int   uSegCount;
uniform vec4  uBoltBox;    // bounding box of the bolt: minX, minY, maxX, maxY

const float WIND = 0.16;               // how far rain leans sideways per unit fallen
const vec3  FLASH_COL = vec3(0.72, 0.78, 1.0); // lightning is blue-white

// ---------------------------------------------------------------------------
// Hashing: turn integer grid coordinates into repeatable pseudo-random numbers.
// mixBits scrambles the bits of a 32-bit integer with xor-shifts and odd
// multipliers, so neighbouring inputs give unrelated outputs.
// ---------------------------------------------------------------------------
uint mixBits(uint x) {
  x ^= x >> 16; x *= 0x7feb352du;
  x ^= x >> 15; x *= 0x846ca68bu;
  x ^= x >> 16;
  return x;
}
// +65536 keeps the ints positive so int->uint is always well defined.
float hash11(float n) {
  return float(mixBits(uint(int(n) + 65536)) >> 8) / 16777215.0;
}
float hash21(vec2 c) {
  uint h = mixBits(uint(int(c.x) + 65536) ^ mixBits(uint(int(c.y) + 65536)));
  return float(h >> 8) / 16777215.0;
}

// Value noise: random values on the corners of a grid cell, blended smoothly
// across the cell. The f*f*(3-2f) curve has zero slope at the cell edges, so
// there are no visible creases between cells.
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

// fbm (fractal Brownian motion): add several noise layers ("octaves"), each at
// double the frequency and half the strength of the previous one. Big soft
// shapes + smaller and smaller detail = something that looks like cloud.
// Rotating between octaves hides the grid alignment of the value noise.
float fbm(vec2 p, int octaves) {
  const mat2 R = mat2(0.8, -0.6, 0.6, 0.8);
  float sum = 0.0, amp = 0.5, norm = 0.0;
  for (int i = 0; i < 5; i++) {
    if (i >= octaves) break;
    sum += amp * vnoise(p);
    norm += amp;
    p = R * p * 2.03 + 17.1;
    amp *= 0.5;
  }
  return sum / norm; // back to roughly 0..1
}

// ---------------------------------------------------------------------------
// Clouds. Returns x = coverage (0 clear sky .. 1 solid cloud), y = raw noise
// value, which we reuse as "thickness" for shading.
// ---------------------------------------------------------------------------
vec2 clouds(vec2 p) {
  // Squash vertically: storm clouds are wide, flat-bottomed layers.
  vec2 q = vec2(p.x * 1.1, p.y * 2.4) + vec2(uTime * 0.015, 0.0);
  // Domain warp: offset the lookup by another noise so edges billow
  // instead of looking like plain blurry blobs.
  float warp = fbm(q * 0.7 + vec2(0.0, uTime * 0.008), 3);
  float n = fbm(q * 1.6 + warp * 1.4 + vec2(uTime * 0.01, 0.0), 5);
  // More cloud higher up, density slider shifts everything.
  float height = smoothstep(0.15, 0.9, p.y);
  float cover = n + (height - 0.5) * 0.35 + (uCloud - 0.5) * 0.6;
  return vec2(smoothstep(0.38, 0.72, cover), n);
}

// Tiny stars, only seen through gaps in the clouds.
float stars(vec2 p) {
  vec2 g = p * 160.0;
  vec2 cell = floor(g);
  float r = hash21(cell);
  if (r > 0.06) return 0.0;                         // ~6% of cells get a star
  vec2 pos = vec2(hash21(cell + 3.1), hash21(cell + 7.7)) - 0.5;
  float d = length(fract(g) - 0.5 - pos * 0.7);
  float twinkle = 0.6 + 0.4 * sin(uTime * (1.0 + r * 30.0) + r * 100.0);
  return smoothstep(0.12, 0.0, d) * twinkle * (0.3 + r * 8.0);
}

// ---------------------------------------------------------------------------
// Landscape: two ridge lines made of 1D noise (noise sampled along x only).
// ---------------------------------------------------------------------------
// y = 0 so we read one row of the grid (y = 0.5 would average two rows and
// flatten the result toward 0.5).
float noise1(float x) { return vnoise(vec2(x, 0.0)); }

float farRidge(float x) {
  return 0.18 + 0.10 * (noise1(x * 2.2 + 3.0) * 0.6 + noise1(x * 6.0 + 1.0) * 0.3 + noise1(x * 17.0) * 0.1);
}

// Conifer silhouettes: split x into slots, some slots get a triangle "tree".
float trees(float x) {
  float g = x * 30.0;
  float cell = floor(g);
  float r = hash11(cell);
  float clump = smoothstep(0.2, 0.4, noise1(x * 2.5 + 11.0)); // trees grow in clumps
  if (r > 0.75 * clump) return 0.0;
  float lx = fract(g) - 0.5 - (hash11(cell + 71.0) - 0.5) * 0.24;
  float h = 0.018 + 0.03 * hash11(cell + 13.0);
  float t = 1.0 - abs(lx) / 0.36;                  // triangle profile
  t *= 0.85 + 0.15 * step(0.5, fract(t * 4.0));    // little tiers of branches
  return max(0.0, h * t);
}

float nearRidge(float x) {
  return 0.07 + 0.09 * noise1(x * 1.4 + 40.0) + 0.02 * noise1(x * 8.0) + trees(x);
}

// Warm, slightly flickering town lights on the far hills.
float townLights(vec2 p, float near, float far) {
  if (p.y > far - 0.004 || p.y < near) return 0.0;
  float town = smoothstep(0.55, 0.75, noise1(p.x * 1.3 + 5.0));
  if (town <= 0.0) return 0.0;
  vec2 g = p * vec2(140.0, 260.0);
  vec2 cell = floor(g);
  float r = hash21(cell + 50.0);
  if (r > 0.12) return 0.0;
  vec2 pos = vec2(hash21(cell + 1.3), hash21(cell + 2.9)) - 0.5;
  vec2 d = (fract(g) - 0.5 - pos * 0.6) / vec2(140.0, 260.0);   // back to uv units
  float flicker = 0.85 + 0.15 * sin(uTime * 3.0 + r * 60.0);   // rain shimmering in front
  return town * exp(-dot(d, d) / 1.6e-6) * flicker * (0.4 + r * 3.0);
}

// ---------------------------------------------------------------------------
// Rain: one layer of streaks. The screen is cut into vertical columns; each
// column is cut into cells along y. A cell holds at most one drop. Scrolling
// the y lookup by time makes the drops fall; skewing x by y makes them lean.
//   cols   = columns across one screen height (more = smaller, farther)
//   cellH  = cell height in screen units (controls spacing + streak length)
//   speed  = fall speed in screen heights per second
// ---------------------------------------------------------------------------
float rainLayer(vec2 p, float cols, float cellH, float speed, float seed, float amount) {
  p.x += p.y * WIND + seed;
  float x = p.x * cols;
  float ci = floor(x);
  float colRnd = hash21(vec2(ci, seed * 31.0));
  // Each column falls at a slightly different speed so rows don't line up.
  float y = p.y / cellH + uTime * speed / cellH * (0.85 + 0.3 * colRnd) + colRnd * 50.0;
  float di = floor(y);
  float f = fract(y);                        // 0 = bottom of cell, 1 = top
  float dropRnd = hash21(vec2(ci + seed * 7.0, di));
  if (dropRnd > amount) return 0.0;          // this cell is empty
  float xo = (hash21(vec2(di, ci + seed * 3.0)) - 0.5) * 0.5;
  float dx = abs(fract(x) - 0.5 - xo);
  float across = 1.0 - smoothstep(0.0, 0.07, dx);
  // The head of the drop is the lowest point (it's falling), the tail fades upward.
  float along = smoothstep(0.0, 0.05, f) * (1.0 - smoothstep(0.0, 0.55, f));
  return across * along * (0.6 + 0.4 * hash11(di + ci));
}

// ---------------------------------------------------------------------------
// Lightning glow.
// segDist: shortest distance from point p to the line segment a-b. Project p
// onto the line, clamp the projection to the segment (h in 0..1), measure.
// ---------------------------------------------------------------------------
float segDist(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h);
}

// Returns x = hot core, y = soft halo. For every segment we compute the
// distance and keep the strongest response (max, not sum, so overlapping
// segments at joints don't double up into bright dots).
vec2 boltGlow(vec2 p) {
  if (uSegCount == 0 || uBolt <= 0.001) return vec2(0.0);
  // Cheap early exit: pixels far from the bolt's box can't get any glow.
  const float M = 0.3;
  if (p.x < uBoltBox.x - M || p.x > uBoltBox.z + M || p.y < uBoltBox.y - M || p.y > uBoltBox.w + M) return vec2(0.0);
  float core = 0.0, halo = 0.0;
  for (int i = 0; i < 64; i++) {
    if (i >= uSegCount) break;
    float d = segDist(p, uSeg[i].xy, uSeg[i].zw);
    float b = uSegB[i];
    // Gaussian core about 1px wide: exp(-d^2 / 2sigma^2) with sigma ~ 0.0011.
    core = max(core, b * exp(-d * d * 4.0e5));
    // Halo: an exponential "bloom" near the channel plus a long 1/(1+d^2) tail.
    halo = max(halo, b * (0.6 * exp(-d * 70.0) + 0.3 / (1.0 + d * d * 900.0)));
  }
  return vec2(core, halo) * uBolt;
}

// ACES-style filmic tone curve: squeezes bright HDR values into 0..1 smoothly
// instead of clipping, and keeps the darks dark. Coefficients are the
// widely published Narkowicz curve fit.
vec3 toneMap(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 p = frag / uRes.y;                // height-normalised coordinates
  vec2 uv = frag / uRes;                 // 0..1 in both axes (for vignette)

  // ---- sky ----
  vec3 col = mix(vec3(0.020, 0.024, 0.036), vec3(0.006, 0.008, 0.016), p.y);
  vec3 townGlow = vec3(0.045, 0.022, 0.010);         // orange light pollution
  col += townGlow * exp(-max(p.y - 0.15, 0.0) * 6.0);

  vec2 cl = clouds(p);
  float cov = cl.x, thick = cl.y;
  col += vec3(0.8, 0.85, 1.0) * stars(p) * 0.05 * pow(1.0 - cov, 3.0);

  // Cloud colour: dim blue-grey, underside tinted by the town glow.
  vec3 cloudCol = vec3(0.028, 0.031, 0.040) * (0.55 + 0.9 * thick)
                + townGlow * 0.9 * exp(-max(p.y - 0.2, 0.0) * 3.0);
  col = mix(col, cloudCol, cov * 0.95);

  // ---- lightning lighting the sky ----
  // Light from the strike is strongest around where the bolt leaves the
  // cloud (uFlashPos) and spreads through the whole cloud deck more weakly.
  // Thick cloud scatters more light back at us than the gaps between clouds.
  float local = exp(-length((p - uFlashPos) * vec2(0.8, 1.6)) * 3.0);
  col += FLASH_COL * uFlash * (0.12 + cov * (0.35 + 3.0 * local) * (0.4 + thick));

  // ---- the bolt itself ----
  vec2 g = boltGlow(p);
  // Up inside the cloud base the channel is hidden by cloud, so only its glow shows.
  float hidden = cov * smoothstep(0.6, 0.85, p.y);
  col += vec3(1.0) * g.x * 9.0 * (1.0 - 0.85 * hidden);
  col += FLASH_COL * g.y * (1.6 + cov * 1.5);

  // ---- landscape (drawn after the bolt so hills hide its lower end) ----
  float far = farRidge(p.x);
  float near = nearRidge(p.x);
  // Mist hugging the far hills; the flash lights it up too.
  col += (vec3(0.020, 0.020, 0.026) + FLASH_COL * uFlash * 0.25) * exp(-abs(p.y - far) * 25.0);
  if (p.y < far) col = vec3(0.010, 0.011, 0.016) + FLASH_COL * uFlash * 0.05;
  col += vec3(1.0, 0.55, 0.22) * townLights(p, near, far) * 4.0;
  if (p.y < near) col = vec3(0.003, 0.004, 0.006) + FLASH_COL * uFlash * 0.012;

  // ---- rain (in front of everything) ----
  float amt = uRain * 0.7;
  float rain = rainLayer(p, 22.0, 0.16, 1.40, 0.0, amt)
             + rainLayer(p, 45.0, 0.10, 1.00, 3.1, amt) * 0.55
             + rainLayer(p, 90.0, 0.06, 0.70, 7.3, amt) * 0.3;
  // Drops catch the flash: barely visible normally, bright streaks during a strike.
  col += vec3(0.55, 0.6, 0.7) * rain * (0.07 + 1.2 * uFlash);
  col += vec3(0.010, 0.011, 0.014) * uRain;          // overall wet haze

  // ---- finishing ----
  col = toneMap(col * 0.6);                                 // 0.6 = exposure
  col *= 1.0 - 0.45 * pow(length(uv - 0.5) * 1.15, 2.2);   // vignette
  col = pow(col, vec3(1.0 / 2.2));                          // linear -> screen gamma
  col += (hash21(frag + fract(uTime) * 1000.0) - 0.5) * 0.012; // film grain (also hides banding)
  outColor = vec4(col, 1.0);
}
</script>

<script>
'use strict';
// ===========================================================================
// Settings (the panel edits these later)
// ===========================================================================
const settings = { rain: 0.55, clouds: 0.65, scale: 0.75 };

// ===========================================================================
// WebGL2 setup
// ===========================================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });

function fail(msg) {
  const e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = 'grid';
  throw new Error(msg);
}
if (!gl) fail('Your browser or GPU does not support WebGL2. Try the latest Chrome or Edge.');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim());
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail('Link error:\n' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray()); // empty VAO: the vertex shader makes its own positions

const U = {};
for (const name of ['uRes', 'uTime', 'uRain', 'uCloud', 'uFlash', 'uBolt', 'uFlashPos',
                    'uSeg', 'uSegB', 'uSegCount', 'uBoltBox']) U[name] = gl.getUniformLocation(prog, name);

// Render at (CSS size × device pixel ratio × render scale); the browser
// stretches the canvas back up to full screen. Lower scale = fewer pixels to shade.
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(1, Math.floor(innerWidth * dpr * settings.scale));
  const h = Math.max(1, Math.floor(innerHeight * dpr * settings.scale));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
addEventListener('resize', resize);
resize();

// ===========================================================================
// Bolt generator (runs on the CPU once per strike)
// Coordinates match the shader: y 0..1 bottom to top, x 0..aspect.
// ===========================================================================
const MAX_SEGS = 64;
const rand = (a, b) => a + Math.random() * (b - a);

// Midpoint displacement: take a straight line, push its midpoint sideways by a
// random amount, then do the same to the two halves with half the push, and so
// on. Big zig-zags first, smaller and smaller kinks after: a jagged channel.
function displace(ax, ay, bx, by, levels, jitter) {
  let pts = [[ax, ay], [bx, by]];
  for (let lvl = 0; lvl < levels; lvl++) {
    const next = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const off = rand(-1, 1) * jitter;
      // (-dy, dx)/len is the direction perpendicular to the segment.
      next.push([(x1 + x2) / 2 - dy / len * off, (y1 + y2) / 2 + dx / len * off], pts[i + 1]);
    }
    pts = next;
    jitter *= 0.5;
  }
  return pts;
}

function makeBolt(targetX, strength) {
  const segs = []; // [ax, ay, bx, by, brightness]
  const sx = targetX + rand(-0.18, 0.18), sy = rand(0.86, 0.95);
  // End below the horizon: the hills drawn in front hide where it really lands.
  const main = displace(sx, sy, targetX + rand(-0.02, 0.02), 0.05, 5, 0.11); // 2^5 = 32 segments
  for (let i = 0; i < main.length - 1; i++) segs.push([...main[i], ...main[i + 1], 1.0]);

  // Branches: start from a random point on the upper part of the main channel,
  // fork off sideways and downward, dimmer and fading toward their tips.
  const branches = Math.round(1 + strength * 3);
  for (let b = 0; b < branches && segs.length + 8 <= MAX_SEGS; b++) {
    const [x0, y0] = main[Math.floor(rand(2, main.length * 0.6))];
    const side = Math.random() < 0.5 ? -1 : 1;
    const ang = side * rand(0.35, 0.9);           // radians away from straight down
    const len = rand(0.08, 0.25) * (0.6 + strength * 0.6);
    const pts = displace(x0, y0, x0 + Math.sin(ang) * len, y0 - Math.cos(ang) * len, 3, 0.04);
    const base = rand(0.35, 0.6);
    for (let i = 0; i < pts.length - 1; i++)
      segs.push([...pts[i], ...pts[i + 1], base * (1 - i / (pts.length - 1)) + 0.05]);
  }
  return segs;
}

// ===========================================================================
// Strike manager: flicker envelope + uploading the bolt to the shader
// ===========================================================================
const segData = new Float32Array(MAX_SEGS * 4);
const segBright = new Float32Array(MAX_SEGS);
const strike = { active: false, start: 0, pulses: [], strength: 0, end: 0 };

function triggerStrike(xFrac, strength) {
  const aspect = canvas.width / canvas.height;
  const x = xFrac * aspect;
  const segs = makeBolt(x, strength);

  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  segData.fill(0); segBright.fill(0);
  segs.forEach((s, i) => {
    segData.set(s.slice(0, 4), i * 4);
    segBright[i] = s[4];
    minX = Math.min(minX, s[0], s[2]); maxX = Math.max(maxX, s[0], s[2]);
    minY = Math.min(minY, s[1], s[3]); maxY = Math.max(maxY, s[1], s[3]);
  });
  gl.uniform4fv(U.uSeg, segData);
  gl.uniform1fv(U.uSegB, segBright);
  gl.uniform1i(U.uSegCount, segs.length);
  gl.uniform4f(U.uBoltBox, minX, minY, maxX, maxY);
  gl.uniform2f(U.uFlashPos, segs[0][0], segs[0][1] - 0.05);

  // Real lightning flickers: the channel re-fires 2-4 times along the same
  // path within half a second. Each pulse jumps up instantly, decays fast.
  const now = performance.now() / 1000;
  const pulses = [{ t: 0, a: 1, tau: 0.07 }];
  let t = 0;
  const n = 1 + Math.floor(rand(1, 4));
  for (let i = 0; i < n; i++) {
    t += rand(0.05, 0.17);
    pulses.push({ t, a: rand(0.45, 1.0), tau: rand(0.04, 0.09) });
  }
  pulses.push({ t: 0, a: 0.22, tau: 0.4 }); // slow afterglow in the clouds
  Object.assign(strike, { active: true, start: now, pulses, strength, end: t + 1.8 });

  playThunder(strength);
  document.getElementById('hint')?.classList.add('gone');
}

function updateStrike(now) {
  if (!strike.active) return { flash: 0, bolt: 0 };
  const t = now - strike.start;
  if (t > strike.end) { strike.active = false; gl.uniform1i(U.uSegCount, 0); return { flash: 0, bolt: 0 }; }
  let env = 0;
  for (const p of strike.pulses) if (t >= p.t) env += p.a * Math.exp(-(t - p.t) / p.tau);
  return {
    flash: Math.min(1.6, env * (0.5 + strike.strength * 0.8)),
    bolt: Math.min(1, env * 1.6) * (0.6 + strike.strength * 0.4),
  };
}

// ===========================================================================
// Audio: synthesized thunder + a steady medium rain bed. No sound files.
// Browsers only allow audio after a user gesture, so this starts on the
// first click or key press.
// ===========================================================================
const audio = { ctx: null, master: null, white: null, brown: null, rainGain: null, thunderUntil: 0, muted: false };

function noiseBuffer(ctx, seconds, brown) {
  const buf = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < d.length; i++) {
    const w = Math.random() * 2 - 1;
    // Brown noise = running sum of white noise (leaky so it doesn't drift).
    // It's heavy in low frequencies: the natural base for a rumble.
    if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
  }
  return buf;
}

function ensureAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const ctx = new AudioContext();
  audio.ctx = ctx;
  // master gain (mute) -> compressor (stops loud strikes from clipping) -> speakers
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.ratio.value = 4;
  audio.master = ctx.createGain();
  audio.master.gain.value = audio.muted ? 0 : 1;
  audio.master.connect(comp).connect(ctx.destination);
  audio.white = noiseBuffer(ctx, 4, false);
  audio.brown = noiseBuffer(ctx, 8, true);

  // Rain bed: looping white noise band-limited to the "hiss" range of rain
  // hitting the ground, plus a quieter low layer for body.
  const src = ctx.createBufferSource();
  src.buffer = audio.white; src.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 600;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500;
  const body = ctx.createBiquadFilter(); body.type = 'lowpass'; body.frequency.value = 500;
  const bodyGain = ctx.createGain(); bodyGain.gain.value = 0.5;
  audio.rainGain = ctx.createGain();
  audio.rainGain.gain.value = 0;
  src.connect(hp).connect(lp).connect(audio.rainGain);
  src.connect(body).connect(bodyGain).connect(audio.rainGain);
  audio.rainGain.connect(audio.master);
  src.start();
}

function updateRainSound(t) {
  if (!audio.ctx) return;
  // Volume follows the rain slider, with a slow gentle swell so it feels alive.
  const target = settings.rain * 0.09 * (0.88 + 0.12 * Math.sin(t * 0.37) * Math.sin(t * 0.11));
  audio.rainGain.gain.setTargetAtTime(target, audio.ctx.currentTime, 0.3);
}

function playThunder(strength) {
  ensureAudio();
  const ctx = audio.ctx;
  // Distance in km. Stronger strikes tend to be closer. Sound travels ~1 km in 3 s.
  const dist = 0.1 + Math.pow(Math.random(), 1.5) * 1.6 * (1.2 - strength * 0.5);
  const t0 = ctx.currentTime + dist * 3;
  const close = dist < 0.6;
  const dur = rand(3, 4) + Math.min(dist, 1.5) * 1.3;   // ~3-6 s
  const loud = Math.max(0.15, Math.min(1, strength * (1.15 - dist * 0.35)));

  // Rumble: brown noise -> two lowpass filters. Closer = brighter (higher cutoff).
  const src = ctx.createBufferSource(); src.buffer = audio.brown;
  const lp1 = ctx.createBiquadFilter(); lp1.type = 'lowpass';
  const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 400;
  lp1.frequency.setValueAtTime(close ? 420 : rand(140, 260), t0);
  lp1.frequency.setTargetAtTime(90, t0 + 0.3, dur * 0.35);   // high end dies first as it rolls away
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t0);
  const attack = close ? 0.03 : rand(0.25, 0.5);
  g.gain.linearRampToValueAtTime(loud * (close ? 1 : 0.75), t0 + attack);
  // "Rolling": jump between random levels every 0.12-0.45 s under a decaying curve.
  for (let t = t0 + attack; t < t0 + dur;) {
    t += rand(0.12, 0.45);
    const left = Math.max(0, 1 - (t - t0) / dur);
    g.gain.linearRampToValueAtTime(loud * Math.pow(left, 1.5) * rand(0.35, 1), Math.min(t, t0 + dur));
  }
  g.gain.linearRampToValueAtTime(0, t0 + dur + 0.3);
  src.connect(lp1).connect(lp2).connect(g).connect(audio.master);
  src.start(t0, rand(0, 2));
  src.stop(t0 + dur + 0.5);

  // Close strike: a sharp crack first (short burst of high-passed noise).
  if (close) {
    const c = ctx.createBufferSource(); c.buffer = audio.white;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(0, t0);
    cg.gain.linearRampToValueAtTime(loud * 0.9, t0 + 0.005);
    cg.gain.exponentialRampToValueAtTime(0.001, t0 + rand(0.2, 0.35));
    c.connect(hp).connect(cg).connect(audio.master);
    c.start(t0, rand(0, 3));
    c.stop(t0 + 0.4);
  }
  // Remember (in performance.now() seconds) when this thunder ends,
  // so the mic can ignore our own speakers until then.
  const endPerf = performance.now() / 1000 + (t0 + dur + 0.3 - ctx.currentTime);
  audio.thunderUntil = Math.max(audio.thunderUntil, endPerf);
}

function setMuted(m) {
  audio.muted = m;
  if (audio.ctx) audio.master.gain.setTargetAtTime(m ? 0 : 1, audio.ctx.currentTime, 0.05);
}

// ===========================================================================
// Input
// ===========================================================================
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  triggerStrike(e.clientX / innerWidth, rand(0.65, 0.9));
});
addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { ensureAudio(); setMuted(!audio.muted); }
});

// ===========================================================================
// Render loop
// ===========================================================================
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsLast = performance.now();
const t0 = performance.now();

function frame(now) {
  const t = (now - t0) / 1000;
  const s = updateStrike(now / 1000);
  updateRainSound(t);

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uRain, settings.rain);
  gl.uniform1f(U.uCloud, settings.clouds);
  gl.uniform1f(U.uFlash, s.flash);
  gl.uniform1f(U.uBolt, s.bolt);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  fpsFrames++;
  if (now - fpsLast > 500) {
    fpsEl.textContent = Math.round(fpsFrames * 1000 / (now - fpsLast)) + ' fps · ' + canvas.width + '×' + canvas.height;
    fpsFrames = 0;
    fpsLast = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
