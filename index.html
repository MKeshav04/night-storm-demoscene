<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Storm</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #c9d1e0; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #fps { position: fixed; top: 8px; left: 10px; opacity: .3; font-variant-numeric: tabular-nums; pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; background: #000; }
  .box { position: fixed; background: rgba(10, 12, 20, .72); border: 1px solid rgba(160, 175, 210, .18); border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud { left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; max-width: min(320px, calc(100vw - 48px)); opacity: .75; }
  #hud button { font: inherit; color: inherit; background: #1d2538; border: 1px solid #3a4560; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #hud button:hover { background: #26304a; }
  #meter { width: 200px; height: 10px; border-radius: 3px; background: #0b0e16; display: none; }
  #micMsg { font-size: 12px; opacity: .8; }
  #micMsg:empty { display: none; }
  #panel { right: 12px; top: 12px; width: 240px; display: none; }
  #panel.open { display: block; }
  #panel h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  #panel label { display: block; margin: 8px 0 2px; font-size: 12px; }
  #panel input[type=range] { width: 100%; }
  #panel .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; }
  #hint { left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; transition: opacity 1.5s; opacity: .8; background: none; border: none; backdrop-filter: none; }
  #hint.gone { opacity: 0; }
  #hint b { font-weight: 400; font-size: 17px; letter-spacing: .03em; }
  #hint small { display: block; opacity: .55; margin-top: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<div id="hint" class="box"><b>Click or clap to summon lightning</b><small>Count the seconds to the thunder: 3 s ≈ 1 km · H settings · M mute</small></div>

<div id="hud" class="box">
  <button id="micBtn">Enable mic</button>
  <canvas id="meter" width="200" height="10" title="Mic level. The red line is the trigger threshold."></canvas>
  <div id="micMsg"></div>
</div>

<div id="panel" class="box">
  <h3>Settings</h3>
  <label>Mic sensitivity <span id="vSens"></span></label>
  <input id="sens" type="range" min="1" max="10" step="1">
  <label>Rain amount <span id="vRain"></span></label>
  <input id="rain" type="range" min="0" max="1" step="0.05">
  <label>Cloud density <span id="vClouds"></span></label>
  <input id="clouds" type="range" min="0" max="1" step="0.05">
  <label>Render scale <span id="vScale"></span></label>
  <input id="scale" type="range" min="0.5" max="1" step="0.05">
  <div class="row"><input id="headphones" type="checkbox"><label for="headphones" style="margin:0">Headphones mode</label></div>
  <div class="row"><input id="mute" type="checkbox"><label for="mute" style="margin:0">Mute (M)</label></div>
</div>
<div id="err"></div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
// One triangle that covers the whole screen. No vertex buffer needed:
// gl_VertexID 0,1,2 -> (0,0), (2,0), (0,2) in 0..2 space -> clip space -1..3.
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
out vec4 outColor;

// We are looking up into an overcast night sky. Between strikes it is almost
// black. Everything you see during a strike is light from the lightning:
//   1. the visible channel (core + halo), drawn by JS into textures
//   2. the cloud base lit from below by that channel (uWide)
//   3. the cloud lit from inside by the in-cloud part of the discharge (uFlash)
//   4. raindrops catching all of that light
// Coordinates: p.y 0 (bottom) .. 1 (top), p.x 0 .. aspect. uv is 0..1 both ways.

uniform vec2  uRes;
uniform float uTime;
uniform float uRain;       // rain amount 0..1
uniform float uCloud;      // cloud density 0..1
uniform float uFlash;      // in-cloud light right now, 0..~1.5
uniform vec2  uFlashPos;   // centre of the in-cloud discharge (p coordinates)
uniform float uMain;       // brightness of the main channel right now
uniform float uBranch;     // brightness of the branches right now
uniform sampler2D uCore;   // sharp bolt:     R = main channel, G = branches
uniform sampler2D uHalo;   // blurred bolt:   the glow you see around the channel
uniform sampler2D uWide;   // very blurred:   the light the bolt throws on the clouds

const vec3 FLASH_COL = vec3(0.74, 0.78, 1.0);   // lightning is blue-white
const float WIND = 0.12;

// ---------------------------------------------------------------------------
// Hashing: integer grid coordinates -> repeatable pseudo-random 0..1.
// mixBits scrambles bits with xor-shifts and odd multipliers so neighbouring
// inputs give unrelated outputs. +65536 keeps ints positive for int->uint.
// ---------------------------------------------------------------------------
uint mixBits(uint x) {
  x ^= x >> 16; x *= 0x7feb352du;
  x ^= x >> 15; x *= 0x846ca68bu;
  x ^= x >> 16;
  return x;
}
float hash11(float n) { return float(mixBits(uint(int(n) + 65536)) >> 8) / 16777215.0; }
float hash21(vec2 c) {
  uint h = mixBits(uint(int(c.x) + 65536) ^ mixBits(uint(int(c.y) + 65536)));
  return float(h >> 8) / 16777215.0;
}

// Value noise: random values on grid corners, blended smoothly across the
// cell. f*f*(3-2f) has zero slope at the edges, so no creases between cells.
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), u.x),
             mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), u.x), u.y);
}

// fbm: several noise layers, each double the frequency and half the strength.
// Big soft shapes plus finer and finer detail reads as cloud. Rotating between
// octaves hides the grid alignment of value noise.
float fbm(vec2 p, int octaves) {
  const mat2 R = mat2(0.8, -0.6, 0.6, 0.8);
  float sum = 0.0, amp = 0.5, norm = 0.0;
  for (int i = 0; i < 5; i++) {
    if (i >= octaves) break;
    sum += amp * vnoise(p);
    norm += amp;
    p = R * p * 2.03 + 17.1;
    amp *= 0.5;
  }
  return sum / norm;
}

// ---------------------------------------------------------------------------
// Cloud density (0 = gap, 1 = thick cloud) at screen point p.
// Domain warp: we bend the lookup position with a second, coarse noise, so
// the shapes billow and fold like the lumpy base of a storm cloud instead of
// looking like round blurry blobs.
// ---------------------------------------------------------------------------
float cloudDensity(vec2 p, int octaves) {
  vec2 q = p * 1.5 + vec2(uTime * 0.010, uTime * 0.004);
  vec2 w = vec2(fbm(q * 0.5, 2), fbm(q * 0.5 + 5.2, 2));
  float n = fbm(q + (w - 0.5) * 1.8, octaves);
  float lo = 0.60 - uCloud * 0.40;
  return smoothstep(lo, lo + 0.32, n);
}

// How much light gets from the in-cloud discharge at l to point p.
// We step along the line p -> l, add up the cloud density we pass through
// and use Beer's law: light left = exp(-total material in the way).
// Thick lumps between you and the source become dark, thin parts glow:
// that is what gives the flash its 3D, lit-from-inside look.
float transmittance(vec2 p, vec2 l) {
  float sum = 0.0;
  for (int i = 1; i <= 4; i++) sum += cloudDensity(mix(p, l, float(i) / 5.0), 2);
  return exp(-sum * length(l - p) * 2.2);
}

// ---------------------------------------------------------------------------
// Rain: one layer of streaks. Columns across the screen, cells along y, at
// most one drop per cell. Scrolling the y lookup by time makes drops fall;
// skewing x by y makes them lean in the wind.
// ---------------------------------------------------------------------------
float rainLayer(vec2 p, float cols, float cellH, float speed, float seed, float amount) {
  p.x += p.y * WIND + seed;
  float x = p.x * cols;
  float ci = floor(x);
  float colRnd = hash21(vec2(ci, seed * 31.0));
  float y = p.y / cellH + uTime * speed / cellH * (0.85 + 0.3 * colRnd) + colRnd * 50.0;
  float di = floor(y);
  float f = fract(y);
  if (hash21(vec2(ci + seed * 7.0, di)) > amount) return 0.0;
  float xo = (hash21(vec2(di, ci + seed * 3.0)) - 0.5) * 0.5;
  float across = 1.0 - smoothstep(0.0, 0.07, abs(fract(x) - 0.5 - xo));
  // Head of the drop is its lowest point (it is falling); tail fades upward.
  float along = smoothstep(0.0, 0.05, f) * (1.0 - smoothstep(0.0, 0.55, f));
  return across * along * (0.6 + 0.4 * hash11(di + ci));
}

// Filmic tone curve (the widely published Narkowicz ACES fit): squeezes very
// bright values smoothly into 0..1 instead of clipping, keeps darks dark.
vec3 toneMap(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = gl_FragCoord.xy / uRes.y;
  vec2 ch = vec2(uMain, uBranch);

  float d = cloudDensity(p, 5);

  // Night ambient: almost nothing. Cloud is a hair lighter than the gaps, so
  // with dark-adapted eyes you can just sense shapes. Nothing more.
  vec3 col = vec3(0.0020, 0.0022, 0.0030) + vec3(0.0030, 0.0032, 0.0040) * d;
  float light = 0.0;   // how lit this spot is; used for the rain below

  // Light from the visible channel (blurred far out), hitting the cloud base.
  float wide = dot(texture(uWide, uv).rg, ch);

  if (uFlash > 0.002 || wide > 0.0005) {
    // In-cloud discharge: light spreads from uFlashPos through the cloud.
    // The falloff is an ellipse, wider than tall: cloud layers are flat.
    float fall = exp(-length((p - uFlashPos) * vec2(0.65, 1.15)) * 2.0);
    float T = uFlash * fall > 0.004 ? transmittance(p, uFlashPos) : 0.0;
    float inCloud = uFlash * (0.03 + fall * (0.08 + 1.4 * T));
    // Light from the channel: cloud base facing us reflects more where denser.
    float fromBolt = wide * 3.0;
    light = inCloud + fromBolt;
    // d*d: thin cloud stays dim, thick billows catch the light. That
    // contrast is what makes the cloud look solid instead of like fog.
    float dd = d * d;
    col += FLASH_COL * (inCloud * (0.06 + 1.3 * dd) + fromBolt * (0.04 + 1.4 * dd));
  }

  // The channel itself, in front of the cloud base.
  float core = dot(texture(uCore, uv).rg, ch);
  float halo = dot(texture(uHalo, uv).rg, ch);
  col += vec3(1.0, 0.97, 1.0) * core * 16.0;
  col += vec3(0.62, 0.66, 1.0) * halo * 2.2;
  light += halo * 0.6;

  // Rain: you only really see it when lightning lights it up.
  float amt = uRain * 0.7;
  float rain = rainLayer(p, 22.0, 0.16, 1.40, 0.0, amt)
             + rainLayer(p, 45.0, 0.10, 1.00, 3.1, amt) * 0.55
             + rainLayer(p, 90.0, 0.06, 0.70, 7.3, amt) * 0.3;
  col += vec3(0.6, 0.64, 0.75) * rain * (0.004 + light * 0.2);

  // Finishing: exposure, tone map, gentle vignette, gamma, film grain
  // (grain also hides colour banding in the near-black gradients).
  col = toneMap(col * 0.8);
  col *= 1.0 - 0.3 * pow(length(uv - 0.5) * 1.15, 2.2);
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash21(gl_FragCoord.xy + fract(uTime) * 1000.0) - 0.5) * 0.010;
  outColor = vec4(max(col, 0.0), 1.0);
}
</script>

<script>
'use strict';
// ===========================================================================
// Settings (the panel edits these)
// ===========================================================================
const settings = { sensitivity: 5, rain: 0.55, clouds: 0.7, scale: 0.75, headphones: false };

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
// Roughly bell-shaped random number, mean 0, spread ~1 (sum of 3 uniforms).
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2;

// ===========================================================================
// WebGL2 setup
// ===========================================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });

function fail(msg) {
  const e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = 'grid';
  throw new Error(msg);
}
if (!gl) fail('Your browser or GPU does not support WebGL2. Try the latest Chrome or Edge.');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim());
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error:\n' + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail('Link error:\n' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray()); // empty VAO: the vertex shader makes its own positions

const U = {};
for (const name of ['uRes', 'uTime', 'uRain', 'uCloud', 'uFlash', 'uFlashPos', 'uMain', 'uBranch',
                    'uCore', 'uHalo', 'uWide']) U[name] = gl.getUniformLocation(prog, name);

// Three bolt textures on texture units 0, 1, 2. Start as 1×1 black.
function makeTexture(unit) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
  return { t, unit };
}
const tex = { core: makeTexture(0), halo: makeTexture(1), wide: makeTexture(2) };
gl.uniform1i(U.uCore, 0);
gl.uniform1i(U.uHalo, 1);
gl.uniform1i(U.uWide, 2);

function uploadTexture({ t, unit }, source) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);  // canvas y goes down, GL y goes up
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
}

// Render at (CSS size × device pixel ratio × render scale); the browser
// stretches the canvas back up to full screen. Lower scale = fewer pixels to shade.
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(1, Math.floor(innerWidth * dpr * settings.scale));
  const h = Math.max(1, Math.floor(innerHeight * dpr * settings.scale));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
addEventListener('resize', resize);
resize();

// ===========================================================================
// Bolt shape (CPU, once per strike). Units: y 0..1 bottom to top, x 0..aspect.
// Real lightning is a chain of short, randomly angled steps (the "stepped
// leader" feels its way down ~50 m at a time), with wandering on bigger
// scales too. So we walk toward the target in tiny steps, each one turned by
// a random angle, plus a slowly drifting "meander" for the large-scale bends.
// ===========================================================================
const STEP = 0.0075;   // one step ≈ 6 px on a 810 px tall render

function walkTo(x, y, tx, ty) {
  const pts = [[x, y]];
  let meander = 0;
  for (let i = 0; i < 800 && Math.hypot(tx - x, ty - y) > STEP; i++) {
    meander = clamp(meander + gauss() * 0.16, -0.7, 0.7);
    const kink = Math.random() < 0.07 ? gauss() * 0.9 : 0;    // occasional sharp jog
    const a = Math.atan2(ty - y, tx - x) + meander + gauss() * 0.42 + kink;
    const l = STEP * rand(0.4, 1.5);
    x += Math.cos(a) * l;
    y += Math.sin(a) * l;
    pts.push([x, y]);
  }
  return pts;
}

// A branch has no target: it keeps a general heading and wanders.
function walkDir(x, y, ang, len) {
  const pts = [[x, y]];
  let meander = 0, done = 0;
  while (done < len) {
    meander = clamp(meander + gauss() * 0.2, -0.8, 0.8);
    const a = ang + meander + gauss() * 0.45;
    const l = STEP * rand(0.4, 1.4);
    x += Math.cos(a) * l;
    y += Math.sin(a) * l;
    done += l;
    pts.push([x, y]);
  }
  return pts;
}

// Each line: { pts, ch: 0 main / 1 branch, w0, w1 (width start/end), b0, b1 (brightness), fadeIn }
function makeBolt(cx, size) {
  const lines = [];
  const sx = cx + rand(-0.25, 0.25), sy = rand(0.95, 1.12);   // starts in the cloud, often above the screen
  const main = walkTo(sx, sy, cx + rand(-0.06, 0.06), -0.1);  // exits below the screen
  lines.push({ pts: main, ch: 0, w0: 1, w1: 1, b0: 1, b1: 1, fadeIn: 10 });

  // Branches: more of them high up (where the leader forked most), heading
  // down and outward, thinner and fading to nothing at their tips.
  function branch(pts, i0, depth, bright, width) {
    const [x, y] = pts[i0];
    const [px, py] = pts[Math.max(0, i0 - 3)];
    const heading = Math.atan2(y - py, x - px);               // local direction of the parent
    const side = Math.random() < 0.5 ? -1 : 1;
    const ang = clamp(heading + side * rand(0.3, 1.0), -Math.PI + 0.3, -0.3); // keep it going downward
    const len = rand(0.05, 0.3) * (0.4 + y * 0.8) / (depth + 1);
    const bp = walkDir(x, y, ang, len);
    lines.push({ pts: bp, ch: 1, w0: width, w1: width * 0.3, b0: bright, b1: 0 });
    if (depth < 2) for (let i = 3; i < bp.length; i++)
      if (Math.random() < 0.035) branch(bp, i, depth + 1, bright * 0.6, width * 0.7);
  }
  const maxBranches = Math.round(rand(4, 9) * (0.6 + size * 0.4));
  let made = 0;
  for (let i = 8; i < main.length - 5 && made < maxBranches; i++) {
    const y = main[i][1];
    if (Math.random() < 0.05 * clamp(y + 0.2, 0.2, 1)) { branch(main, i, 0, rand(0.35, 0.7), 0.65); made++; }
  }
  // A few faint channels crawling sideways inside the cloud near the top.
  const n = Math.floor(rand(1, 4));
  for (let k = 0; k < n; k++) {
    const ang = (Math.random() < 0.5 ? 0 : Math.PI) + gauss() * 0.3;
    // inCloud: hidden by the cloud, so it's left out of the sharp layer and only glows through.
    lines.push({ pts: walkDir(sx, Math.min(sy, 0.97), ang, rand(0.15, 0.45)), ch: 1, w0: 1.5, w1: 0.8, b0: 0.5, b1: 0.05, fadeIn: 6, inCloud: true });
  }
  return { lines, start: [sx, Math.min(sy, 0.92)] };
}

// Draw all lines into a 2D canvas: main channel in red, branches in green.
// 'lighten' keeps the brightest value per pixel, so where segments overlap at
// joints they don't add up into bright dots.
function drawLines(c, lines, aspect, widthPx) {
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighten';
  ctx.lineCap = 'round';
  for (const L of lines) {
    const n = L.pts.length - 1;
    for (let i = 0; i < n; i++) {
      const f = i / n;
      let b = L.b0 + (L.b1 - L.b0) * f;
      if (L.fadeIn) b *= Math.min(1, (i + 1) / L.fadeIn);   // emerging from the cloud
      const v = Math.round(255 * clamp(b, 0, 1));
      if (v < 2) continue;
      ctx.strokeStyle = L.ch === 0 ? `rgb(${v},0,0)` : `rgb(0,${v},0)`;
      ctx.lineWidth = Math.max(0.5, (L.w0 + (L.w1 - L.w0) * f) * widthPx);
      const [x0, y0] = L.pts[i], [x1, y1] = L.pts[i + 1];
      ctx.beginPath();
      ctx.moveTo(x0 / aspect * W, (1 - y0) * H);
      ctx.lineTo(x1 / aspect * W, (1 - y1) * H);
      ctx.stroke();
    }
  }
}

const boltCanvas = { core: document.createElement('canvas'), tmp: document.createElement('canvas'),
                     halo: document.createElement('canvas'), wide: document.createElement('canvas') };

function blurInto(dst, src, px, add) {
  const ctx = dst.getContext('2d');
  ctx.globalCompositeOperation = add ? 'lighter' : 'source-over';
  ctx.filter = `blur(${px}px)`;
  ctx.drawImage(src, 0, 0, dst.width, dst.height);
  ctx.filter = 'none';
}

// Render the bolt at three blur levels and upload them as textures.
// Blur radii are in pixels of each (smaller) canvas, so they're cheap.
function renderBolt(lines, size) {
  const W = Math.min(canvas.width, 2048), H = Math.round(W * canvas.height / canvas.width);
  const aspect = canvas.width / canvas.height;
  const sizeCanvas = (c, w, h) => { if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } };

  sizeCanvas(boltCanvas.core, W, H);
  drawLines(boltCanvas.core, lines.filter(L => !L.inCloud), aspect, H * 0.0024 * size); // ~2 px main channel

  // Halo: half resolution, lines drawn thicker, then blurred twice (tight + loose).
  const hw = W >> 1, hh = H >> 1;
  sizeCanvas(boltCanvas.tmp, hw, hh);
  sizeCanvas(boltCanvas.halo, hw, hh);
  drawLines(boltCanvas.tmp, lines, aspect, hh * 0.006 * size);
  drawLines(boltCanvas.halo, [], aspect, 1);                           // clear to black
  blurInto(boltCanvas.halo, boltCanvas.tmp, 2);
  blurInto(boltCanvas.halo, boltCanvas.tmp, 7, true);

  // Wide: 1/8 resolution, thick lines, heavy blur. This is the light that
  // spills onto the clouds, so it must be smooth and far-reaching.
  const ww = Math.max(8, W >> 3), wh = Math.max(8, H >> 3);
  sizeCanvas(boltCanvas.tmp, ww, wh);
  sizeCanvas(boltCanvas.wide, ww, wh);
  drawLines(boltCanvas.tmp, lines, aspect, 3);
  drawLines(boltCanvas.wide, [], aspect, 1);
  blurInto(boltCanvas.wide, boltCanvas.tmp, 6);
  blurInto(boltCanvas.wide, boltCanvas.tmp, 16, true);

  uploadTexture(tex.core, boltCanvas.core);
  uploadTexture(tex.halo, boltCanvas.halo);
  uploadTexture(tex.wide, boltCanvas.wide);
}

// ===========================================================================
// Strike timing. A real cloud-to-ground flash is several "return strokes"
// down the same channel, 30-120 ms apart. The first stroke lights up all the
// branches; later strokes only light the main channel. Sometimes the cloud
// flickers just before the bolt appears, and sometimes the channel keeps
// glowing for a moment after a stroke ("continuing current").
// ===========================================================================
const strike = { active: false, start: 0, events: [], end: 0, size: 1, gain: 1 };

function triggerStrike(xFrac, strength) {
  const aspect = canvas.width / canvas.height;
  // Distance in km: louder clap / stronger strike = closer. Close bolts are
  // bigger and brighter, and their thunder comes sooner and louder.
  const distKm = clamp((2.4 - strength * 2.0) * rand(0.85, 1.15), 0.35, 3);
  const size = clamp(Math.pow(0.9 / distKm, 0.5), 0.6, 1.5);

  const bolt = makeBolt(xFrac * aspect, size);
  renderBolt(bolt.lines, size);
  gl.uniform2f(U.uFlashPos, bolt.start[0], bolt.start[1]);

  const ev = [];
  let t = 0;
  if (Math.random() < 0.5) {                 // in-cloud flicker before the bolt
    ev.push({ t: 0, main: 0, branch: 0, cloud: rand(0.12, 0.3), tau: 0.04 });
    t = rand(0.05, 0.14);
  }
  const first = t;
  ev.push({ t, main: 1, branch: 1, cloud: 1, tau: 0.05 });
  const strokes = Math.floor(rand(1, 5));    // 1-4 more strokes
  for (let i = 0; i < strokes; i++) {
    t += rand(0.035, 0.12);
    ev.push({ t, main: rand(0.4, 0.95), branch: 0.06, cloud: rand(0.45, 0.85), tau: rand(0.035, 0.06) });
    if (Math.random() < 0.25)                // continuing current: a lingering glow
      ev.push({ t: t + 0.01, main: 0.3, branch: 0, cloud: 0.25, tau: rand(0.1, 0.18) });
  }
  ev.push({ t: first, main: 0, branch: 0, cloud: 0.2, tau: 0.35 });   // clouds' slow afterglow
  Object.assign(strike, { active: true, start: performance.now() / 1000, events: ev, end: t + 2, size,
                          gain: 0.5 + strength * 0.7 });

  scheduleThunder(distKm, xFrac);
  document.getElementById('hint').classList.add('gone');
}

function updateStrike(now) {
  const out = { flash: 0, main: 0, branch: 0 };
  if (!strike.active) return out;
  const t = now - strike.start;
  if (t > strike.end) { strike.active = false; return out; }
  for (const e of strike.events) {
    if (t < e.t) continue;
    const k = Math.exp(-(t - e.t) / e.tau);   // each stroke: instant peak, fast decay
    out.flash += e.cloud * k;
    out.main += e.main * k;
    out.branch += e.branch * k;
  }
  out.flash = Math.min(1.6, out.flash * strike.gain * strike.size);
  out.main = Math.min(1.4, out.main) * (0.7 + 0.3 * strike.size);
  out.branch = Math.min(1.2, out.branch) * (0.7 + 0.3 * strike.size);
  return out;
}

// ===========================================================================
// Audio. Everything is synthesized; there are no sound files.
// Browsers only allow audio after a user gesture, so it starts on the first
// click or key press. Buffers that don't need the AudioContext (rain, echo)
// are computed right after page load at 48 kHz; the browser resamples them.
// ===========================================================================
const SR = 48000;
const audio = { ctx: null, master: null, rainGain: null, reverb: null, muted: false, thunders: [] };

// Rain: thousands of individual drop "ticks" (tiny decaying pings at random
// pitches, mostly quiet, a few loud ones close by) over a soft hiss. Drops wrap
// around the end of the buffer so the 6 s loop has no audible seam.
function makeRainData() {
  const N = SR * 6, chans = [];
  for (let c = 0; c < 2; c++) {
    const d = new Float32Array(N);
    let lp = 0;
    for (let i = 0; i < N; i++) { lp += (Math.random() * 2 - 1 - lp) * 0.25; d[i] = lp * 0.12; }
    for (let k = 0; k < 6 * 900; k++) {
      const pos = Math.floor(Math.random() * N);
      const amp = Math.pow(Math.random(), 3) * 0.5;
      const w = 2 * Math.PI * rand(1200, 6000) / SR;
      const decay = rand(0.001, 0.005) * SR;
      for (let j = 0, len = decay * 4; j < len; j++) d[(pos + j) % N] += amp * Math.exp(-j / decay) * Math.sin(w * j);
    }
    chans.push(d);
  }
  return chans;
}

// Echo: stereo impulse response for a ConvolverNode. Decaying noise (the
// diffuse echo of the land and clouds) plus a few distinct reflections, like
// thunder bouncing off distant hills.
function makeEchoData() {
  const N = SR * 4, chans = [];
  for (let c = 0; c < 2; c++) {
    const d = new Float32Array(N);
    let lp = 0;
    for (let i = 0; i < N; i++) {
      lp += (Math.random() * 2 - 1 - lp) * 0.08;    // dull: echoes lose their highs
      d[i] = lp * Math.exp(-i / (SR * 0.9));
    }
    for (let k = 0; k < 6; k++) {
      const at = Math.floor(rand(0.12, 1.6) * SR);
      for (let j = 0; j < 2000; j++) d[at + j] += (Math.random() * 2 - 1) * 0.25 * Math.exp(-j / 400) * Math.exp(-at / (SR * 1.2));
    }
    chans.push(d);
  }
  return chans;
}

let rainData = null, echoData = null;
setTimeout(() => { rainData = makeRainData(); echoData = makeEchoData(); }, 300);

function toBuffer(ctx, chans) {
  const b = ctx.createBuffer(chans.length, chans[0].length, SR);
  chans.forEach((d, i) => b.copyToChannel(d, i));
  return b;
}

function ensureAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  if (!rainData) { rainData = makeRainData(); echoData = makeEchoData(); }
  const ctx = new AudioContext();
  audio.ctx = ctx;
  // master gain (mute) -> compressor (keeps close strikes from clipping) -> speakers
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -10; comp.ratio.value = 4; comp.attack.value = 0.003;
  audio.master = ctx.createGain();
  audio.master.gain.value = audio.muted ? 0 : 1;
  audio.master.connect(comp).connect(ctx.destination);

  audio.reverb = ctx.createConvolver();
  audio.reverb.buffer = toBuffer(ctx, echoData);
  const wet = ctx.createGain(); wet.gain.value = 0.45;
  audio.reverb.connect(wet).connect(audio.master);

  const src = ctx.createBufferSource();
  src.buffer = toBuffer(ctx, rainData);
  src.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 250;
  audio.rainGain = ctx.createGain();
  audio.rainGain.gain.value = 0;
  src.connect(hp).connect(audio.rainGain).connect(audio.master);
  src.start();
}

function updateRainSound(t) {
  if (!audio.ctx) return;
  const target = settings.rain * 0.5 * (0.88 + 0.12 * Math.sin(t * 0.37) * Math.sin(t * 0.11));
  audio.rainGain.gain.setTargetAtTime(target, audio.ctx.currentTime, 0.3);
}

// ---------------------------------------------------------------------------
// Thunder from physics.
// Thunder is the shock wave from the whole lightning channel. Every few
// metres of channel sends out its own sharp pressure pulse (an "N-wave":
// pressure jumps up, falls below normal, returns). You hear each one when it
// arrives: distance / 343 m/s. The nearest part of the channel arrives first
// (the crack), the far parts high in the cloud arrive seconds later (the long
// roll). Where a stretch of channel is side-on to you, its pulses arrive
// together and pile up into a loud clap; stretches pointing at you smear out
// into rumble. Air also absorbs high frequencies with distance, so the later,
// farther sound is duller. We simulate exactly that.
// ---------------------------------------------------------------------------
function buildThunder(distM) {
  const C = 343;
  const segs = [];               // x, y, z, energy per ~6 m of channel
  const STEP_M = 6;

  // Random walk in 3D: keep some of the last direction, add a random push,
  // and lean toward `bias`. Gives a tortuous channel like real lightning.
  function walk3(p, bias, len, energy, stopZ) {
    let [x, y, z] = p, dx = bias[0], dy = bias[1], dz = bias[2], done = 0;
    const path = [];
    while (done < len) {
      dx += gauss() * 0.55 + bias[0] * 0.6;
      dy += gauss() * 0.55 + bias[1] * 0.6;
      dz += gauss() * 0.55 + bias[2] * 0.6;
      const m = Math.hypot(dx, dy, dz);
      dx /= m; dy /= m; dz /= m;
      const l = STEP_M * rand(0.5, 1.5);
      x += dx * l; y += dy * l; z = Math.max(0, z + dz * l); done += l;
      segs.push(x, y, z, energy * l / STEP_M);
      path.push([x, y, z]);
      if (stopZ && z > stopZ) break;
    }
    return path;
  }
  const az = rand(0, Math.PI * 2);
  const ground = [Math.cos(az) * distM, Math.sin(az) * distM, 0];
  const cloudBase = rand(1300, 2200);
  const main = walk3(ground, [0, 0, 1], 8000, 1, cloudBase);
  const top = main[main.length - 1];
  for (let k = 0, n = Math.floor(rand(3, 7)); k < n; k++) {         // branches below the cloud
    const from = main[Math.floor(rand(0.3, 0.95) * main.length)];
    const a = rand(0, Math.PI * 2);
    walk3(from, [Math.cos(a) * 0.6, Math.sin(a) * 0.6, -0.8], rand(150, 600), 0.35);
  }
  for (let k = 0, n = Math.floor(rand(2, 4)); k < n; k++) {         // long channels inside the cloud
    const a = rand(0, Math.PI * 2);
    walk3(top, [Math.cos(a), Math.sin(a), 0.25], rand(1500, 3500), 0.5);
  }

  // Distance from the listener (standing at the origin, ears at 1.7 m).
  const count = segs.length / 4, r = new Float32Array(count);
  let rMin = Infinity, rMax = 0;
  for (let i = 0; i < count; i++) {
    r[i] = Math.hypot(segs[i * 4], segs[i * 4 + 1], segs[i * 4 + 2] - 1.7);
    rMin = Math.min(rMin, r[i]); rMax = Math.max(rMax, r[i]);
  }
  const PRE = 0.05;                                       // 50 ms of silence first
  const N = Math.floor(Math.min((rMax - rMin) / C + 2.5, 20) * SR);
  const x = new Float32Array(N);

  // 1) Add one N-wave per channel piece at its arrival time. Its length sets
  //    the pitch: ~10-30 ms gives thunder's typical 35-100 Hz. It stretches
  //    with distance (deeper) and gets quieter as 1/r (spherical spreading).
  for (let i = 0; i < count; i++) {
    const start = Math.floor(((r[i] - rMin) / C + PRE) * SR);
    const len = Math.floor((0.009 + 0.006 * r[i] / 1000) * rand(0.6, 1.6) * SR);
    if (start + len >= N) continue;
    const A = segs[i * 4 + 3] * 1000 / r[i];
    for (let k = 0; k < len; k++) x[start + k] += A * (1 - 2 * k / len);
  }

  // 2) Air absorption: low-pass filter whose cutoff falls over time, because
  //    sound arriving at time t travelled rMin + 343·t metres. Two one-pole
  //    filters in a row = a steeper slope.
  let a = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < N; i++) {
    if ((i & 255) === 0) {
      const dist = rMin + C * Math.max(0, i / SR - PRE);
      const fc = Math.min(7000, 1400 * Math.pow(1000 / dist, 1.1));   // 400 m ≈ 3.8 kHz, 3 km ≈ 420 Hz
      a = 1 - Math.exp(-2 * Math.PI * fc / SR);
    }
    y1 += a * (x[i] - y1);
    y2 += a * (y1 - y2);
    x[i] = y2;
  }

  // 3) Body: deep rumble (brown noise) that swells and fades with the
  //    loudness of the pulses, filling the gaps the way the real roll does.
  let env = 0, brown = 0, b2 = 0, b3 = 0, peakX = 1e-9, peakR = 1e-9;
  const rum = new Float32Array(N);
  const ke = 1 / (0.08 * SR);
  const kb = 1 - Math.exp(-2 * Math.PI * 180 / SR);     // extra filtering: keep it below ~180 Hz
  for (let i = 0; i < N; i++) {
    env += (Math.abs(x[i]) - env) * ke;
    brown = (brown + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    b2 += kb * (brown - b2);
    b3 += kb * (b2 - b3);
    rum[i] = b3 * env;
    peakX = Math.max(peakX, Math.abs(x[i]));
    peakR = Math.max(peakR, Math.abs(rum[i]));
  }
  let peak = 1e-9;
  for (let i = 0; i < N; i++) { x[i] = x[i] / peakX * 0.75 + rum[i] / peakR * 0.6; peak = Math.max(peak, Math.abs(x[i])); }

  // Envelope in 50 ms blocks with a slow release: used to mute the mic only
  // while the thunder is actually loud (instead of for its whole tail).
  const block = SR / 20, envBlocks = new Float32Array(Math.ceil(N / block));
  let held = 0;
  for (let b = 0; b < envBlocks.length; b++) {
    let m = 0;
    for (let i = b * block; i < Math.min(N, (b + 1) * block); i++) m = Math.max(m, Math.abs(x[i]) / peak);
    held = Math.max(m, held * 0.9);           // ~0.5 s release, covers the echo
    envBlocks[b] = held;
  }
  for (let i = 0; i < N; i++) x[i] /= peak;
  return { data: x, delay: rMin / C - PRE, env: envBlocks };
}

// Building thunder takes ~0.1 s of maths, which would freeze the animation.
// So it runs in a Web Worker (a background thread). We make the worker from
// the source text of the functions above, so it's still one HTML file.
const thunderWorker = new Worker(URL.createObjectURL(new Blob([`
  const SR = ${SR}; const rand = ${rand}; const clamp = ${clamp}; const gauss = ${gauss};
  ${buildThunder}
  onmessage = e => {
    const th = buildThunder(e.data.distM);
    postMessage({ id: e.data.id, ...th }, [th.data.buffer, th.env.buffer]);
  };`], { type: 'text/javascript' })));
const thunderJobs = new Map();
let thunderId = 0;
thunderWorker.onmessage = e => { thunderJobs.get(e.data.id)?.(e.data); thunderJobs.delete(e.data.id); };

// Ask the worker for a thunder, then start it exactly when the first sound
// would arrive (flash time + nearest distance / speed of sound).
function scheduleThunder(distKm, xFrac) {
  ensureAudio();
  const ctx = audio.ctx;
  const flashAt = ctx.currentTime;
  const perfFlash = performance.now() / 1000;
  const id = ++thunderId;
  thunderWorker.postMessage({ id, distM: distKm * 1000 });
  thunderJobs.set(id, th => {
    const buf = ctx.createBuffer(1, th.data.length, SR);
    buf.copyToChannel(th.data, 0);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const loud = clamp(Math.pow(0.7 / distKm, 0.8), 0.12, 1);
    const g = ctx.createGain(); g.gain.value = loud;
    const pan = ctx.createStereoPanner(); pan.pan.value = clamp((xFrac - 0.5) * 1.4, -0.7, 0.7);
    src.connect(g).connect(pan);
    pan.connect(audio.master);
    pan.connect(audio.reverb);
    const when = flashAt + th.delay;
    if (when > ctx.currentTime) src.start(when);
    else src.start(ctx.currentTime, ctx.currentTime - when);   // built late: skip ahead to stay in sync
    audio.thunders.push({ start: perfFlash + th.delay, env: th.env, loud });
  });
}

// How loud our own thunder is coming out of the speakers right now (0..1).
function thunderLevel(now) {
  let lvl = 0;
  audio.thunders = audio.thunders.filter(th => now < th.start + th.env.length / 20 + 1);
  for (const th of audio.thunders) {
    const b = Math.floor((now - th.start) * 20);
    if (b >= 0 && b < th.env.length) lvl = Math.max(lvl, th.env[b] * th.loud);
  }
  return audio.muted ? 0 : lvl;
}

function setMuted(m) {
  audio.muted = m;
  document.getElementById('mute').checked = m;
  if (audio.ctx) audio.master.gain.setTargetAtTime(m ? 0 : 1, audio.ctx.currentTime, 0.05);
}

// ===========================================================================
// Microphone trigger: onset detection
// Track the room's normal loudness slowly ("background"). A strike fires when
// the sound right now is several times louder than background AND above a
// minimum floor AND it rose suddenly (claps do; voices mostly ramp up).
// ===========================================================================
const mic = { on: false, stream: null, analyser: null, buf: null, bg: 0.004, hist: [], last: -10, rms: 0, thr: 0 };
const micBtn = document.getElementById('micBtn');
const micMsg = document.getElementById('micMsg');
const meter = document.getElementById('meter');
const meterCtx = meter.getContext('2d');

async function toggleMic() {
  if (mic.on) {
    mic.stream.getTracks().forEach(t => t.stop());
    mic.on = false;
    micBtn.textContent = 'Enable mic';
    meter.style.display = 'none';
    micMsg.textContent = '';
    return;
  }
  ensureAudio();
  if (!navigator.mediaDevices?.getUserMedia) {
    micMsg.textContent = 'Mic needs http://localhost or https. Clicking still works.';
    return;
  }
  try {
    // Turn off the browser's voice processing: noise suppression would eat
    // claps, auto gain would keep changing the levels we measure.
    mic.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
  } catch (err) {
    micMsg.textContent = err.name === 'NotAllowedError'
      ? 'Mic permission denied. Clicking still works. To allow it, use the icon at the left of the address bar.'
      : 'Could not open a microphone (' + err.name + '). Clicking still works.';
    return;
  }
  const src = audio.ctx.createMediaStreamSource(mic.stream);
  mic.analyser = audio.ctx.createAnalyser();
  mic.analyser.fftSize = 1024;               // ~21 ms of audio per reading
  mic.buf = new Float32Array(mic.analyser.fftSize);
  src.connect(mic.analyser);                 // NOT to the speakers
  Object.assign(mic, { on: true, bg: 0.004, hist: [], last: -10 });
  micBtn.textContent = 'Disable mic';
  meter.style.display = 'block';
  micMsg.textContent = 'Listening. Clap!';
}
micBtn.addEventListener('click', toggleMic);

function updateMic(now) {
  if (!mic.on) return;
  mic.analyser.getFloatTimeDomainData(mic.buf);
  // RMS (root mean square) = the average power of the samples: a steady loudness number.
  let sum = 0;
  for (let i = 0; i < mic.buf.length; i++) sum += mic.buf[i] * mic.buf[i];
  const rms = Math.sqrt(sum / mic.buf.length);

  // Sensitivity 1..10 -> how many times louder than background, and a floor.
  const s = settings.sensitivity;
  const mult = 14 - s;                        // 13x (deaf) .. 4x (twitchy)
  const floor = 0.006 * (11 - s);             // 0.06 .. 0.006
  const thr = Math.max(mic.bg * mult, floor);
  // "Sudden": compare against the level ~5 frames (~80 ms) ago.
  const before = mic.hist.length >= 5 ? mic.hist[mic.hist.length - 5] : rms;
  // Our own thunder comes out of the speakers into the mic: ignore the mic
  // while it is loud, unless the user wears headphones.
  const suppressed = !settings.headphones && thunderLevel(now) > 0.04;

  if (!suppressed && now - mic.last > 1.5 && rms > thr && rms > before * 2) {
    mic.last = now;
    // Louder = bigger, closer strike: each doubling over the threshold adds 0.3.
    const strength = Math.min(1, 0.35 + Math.log2(rms / thr) * 0.3);
    triggerStrike(rand(0.15, 0.85), strength);
  }
  // Learn the background only from normal frames, never from claps or thunder.
  if (!suppressed && rms < thr) mic.bg += (rms - mic.bg) * (rms > mic.bg ? 0.02 : 0.08);
  mic.hist.push(rms);
  if (mic.hist.length > 10) mic.hist.shift();
  mic.rms = rms; mic.thr = thr;
  drawMeter(suppressed);
}

// Level meter in decibels (-60 dB .. 0 dB) with the trigger threshold as a line.
function drawMeter(suppressed) {
  const W = meter.width, H = meter.height;
  const db = v => clamp((20 * Math.log10(v + 1e-9) + 60) / 60, 0, 1);
  meterCtx.clearRect(0, 0, W, H);
  meterCtx.fillStyle = suppressed ? '#555c6e' : mic.rms > mic.thr ? '#f0d36b' : '#5f8fd8';
  meterCtx.fillRect(0, 0, db(mic.rms) * W, H);
  meterCtx.fillStyle = '#ff6b6b';
  meterCtx.fillRect(Math.round(db(mic.thr) * W) - 1, 0, 2, H);
}

// ===========================================================================
// Settings panel
// ===========================================================================
const panel = document.getElementById('panel');
function bindSlider(id, key, fmt, onChange) {
  const el = document.getElementById(id), out = document.getElementById('v' + id[0].toUpperCase() + id.slice(1));
  el.value = settings[key];
  out.textContent = fmt(settings[key]);
  el.addEventListener('input', () => {
    settings[key] = parseFloat(el.value);
    out.textContent = fmt(settings[key]);
    onChange?.();
  });
}
const pct = v => Math.round(v * 100) + '%';
bindSlider('sens', 'sensitivity', v => v);
bindSlider('rain', 'rain', pct);
bindSlider('clouds', 'clouds', pct);
bindSlider('scale', 'scale', pct, resize);
document.getElementById('headphones').addEventListener('change', e => { settings.headphones = e.target.checked; });
document.getElementById('mute').addEventListener('change', e => { ensureAudio(); setMuted(e.target.checked); });

// ===========================================================================
// Input
// ===========================================================================
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  triggerStrike(e.clientX / innerWidth, rand(0.55, 0.9));
});
addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { ensureAudio(); setMuted(!audio.muted); }
  if (e.key === 'h' || e.key === 'H') panel.classList.toggle('open');
});

// ===========================================================================
// Render loop
// ===========================================================================
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsLast = performance.now();
const t0 = performance.now();

function frame(now) {
  const t = (now - t0) / 1000;
  updateMic(now / 1000);
  const s = updateStrike(now / 1000);
  updateRainSound(t);

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uRain, settings.rain);
  gl.uniform1f(U.uCloud, settings.clouds);
  gl.uniform1f(U.uFlash, s.flash);
  gl.uniform1f(U.uMain, s.main);
  gl.uniform1f(U.uBranch, s.branch);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  fpsFrames++;
  if (now - fpsLast > 500) {
    fpsEl.textContent = Math.round(fpsFrames * 1000 / (now - fpsLast)) + ' fps · ' + canvas.width + '×' + canvas.height;
    fpsFrames = 0;
    fpsLast = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
